databases:
  - name: vetclinic-db
    plan: free

services:
  - type: web
    name: vetclinic-lr5
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: gunicorn vetclinic_site.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vetclinic-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_LOG_LEVEL
        value: INFO
      - key: WEB_CONCURRENCY
        value: "4"
