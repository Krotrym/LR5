services:
  web:
    build: .
    command: python manage.py migrate && python manage.py seed_demo && python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    environment:
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: "127.0.0.1,localhost,0.0.0.0"
      DJANGO_LOG_LEVEL: "INFO"
    volumes:
      - .:/app
